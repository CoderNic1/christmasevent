<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Christmas</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>🎄 Community Christmas</h1><div id="cd" title="Until Christmas"></div>
<div class="me"><span id="pts"></span><button id="login">Login with Discord</button></div></header>
<main>
<section id="room" class="card"><div class="win">🌙</div><div class="floor"></div><div id="items"></div></section>
<section class="card"><h2>💰 Prize pool: <span id="pool"></span></h2><div id="tiers"></div><p id="share" class="muted"></p>
<h3>Payout wallet (EVM)</h3><input id="wallet" placeholder="0x..."><button id="saveW">Save</button><span id="wmsg" class="muted"></span></section>
<section class="card"><h2>🎮 Mini-games</h2><div id="games"></div><div id="arena" hidden></div></section>
<section class="card"><h2>🎁 Community goals</h2><div id="goals"></div></section>
<section class="card"><h2>📅 Advent calendar</h2><div id="cal"></div></section>
<section class="card"><h2>🏆 Leaderboard</h2><ol id="board"></ol></section>
</main><script type="module" src="js/main.js"></script></body></html>
